---
# Monitoring Variables

# Container names
prometheus_name: "prometheus"
alertmanager_name: "alertmanager"
loki_name: "loki"
node_exporter_name: "node-exporter"
cadvisor_name: "cadvisor"
grafana_name: "grafana"

# Docker images (pinned; used by tasks/monitoring.yml)
# cadvisor_image is set in defaults.yml.
prometheus_image: "prom/prometheus:v3.15.1"
alertmanager_image: "prom/alertmanager:v0.34.1"
loki_image: "grafana/loki:2.9.0"
node_exporter_image: "prom/node-exporter:v1.12.1"
grafana_image: "grafana/grafana:13.3.0"
# Grafana Agent reached end of life in Nov 2025 (replacement: Grafana Alloy); v0.44.8 is its final release.
grafana_agent_image: "grafana/agent:v0.44.8"

# Network ports
prometheus_port: 9090
alertmanager_port: 9093
loki_port: 3100
node_exporter_port: 9100
# cadvisor_port is set in defaults.yml.
grafana_port: 3000

# Telegram notifications (optional)
telegram_enabled: false
# telegram_bot_token: "YOUR_BOT_TOKEN"
# telegram_chat_id: "YOUR_CHAT_ID"

# Feature flags
# cadvisor_enabled is defined in defaults.yml and can be overridden in host_vars

# Security
grafana_admin_password: "{{ GRAFANA_ADMIN_PASSWORD | default('admin') }}" 