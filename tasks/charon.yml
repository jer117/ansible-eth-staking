---
- name: Check if cluster lock exists
  become: true
  ansible.builtin.stat:
    path: "/root/.charon/cluster-lock.json"
  register: cluster_lock

# Only the charon container user may enter the directory. It must stay writable by that
# user because charon writes charon-enr-private-key.lock next to the key.
- name: Create Charon directory
  become: true
  ansible.builtin.file:
    path: "/root/.charon"
    owner: "{{ charon_uid }}"
    group: "{{ charon_gid }}"
    state: directory
    mode: "0700"

- name: Copy private key to destination
  become: true
  ansible.builtin.copy:
    content: "{{ host_charon_enr_private_key }}"
    dest: "/root/.charon/charon-enr-private-key"
    owner: "{{ charon_uid }}"
    group: "{{ charon_gid }}"
    mode: "0400"
  no_log: true
  when: host_charon_enr_private_key is defined

# DKG output is usually copied in as root (cluster lock, deposit data, validator_keys).
# Hand it to the charon user and drop group/other access. Owner read/write bits are kept,
# so files charon writes read-only stay read-only. The lock file is skipped because
# charon recreates it while running.
- name: Find Charon data files
  become: true
  ansible.builtin.find:
    paths: "/root/.charon"
    recurse: true
    file_type: any
    hidden: true
    excludes: "charon-enr-private-key.lock"
  register: charon_data_files

- name: Restrict Charon data files to the charon user
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ charon_uid }}"
    group: "{{ charon_gid }}"
    # Clear group/other bits and file execute bits; owner keeps read/write, dirs keep u+x.
    mode: "go=,u-x,u+X"
  loop: "{{ charon_data_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Start/Restart the Charon client docker container
  community.general.docker_container:
    image: "{{ charon_docker_image }}"
    keep_volumes: true
    name: "{{ charon_container_name }}"
    network_mode: bridge
    networks:
      - name: "eth-staking-network-net"
    command: >
      run
      --beacon-node-endpoints http://{{ consensus_docker_container_name }}:{{ consensus_client_http_api_port }}
      --beacon-node-timeout 30s
      --beacon-node-submit-timeout 30s
      --p2p-tcp-address 0.0.0.0:{{ charon_p2p_tcp_port }}
      --validator-api-address 0.0.0.0:{{ charon_validator_api_port }}
      --monitoring-address 0.0.0.0:{{ charon_monitoring_port }}
      --p2p-relays {{ charon_relay_address }}
      --log-level info
      --log-format console
      --log-color auto
      --builder-api true
      --private-key-file-lock false
      --private-key-file /opt/charon/charon-enr-private-key
      --lock-file /opt/charon/cluster-lock.json
      --p2p-external-hostname {{ inventory_hostname }}
      --p2p-external-ip {{ ansible_default_ipv4.address }}
    published_ports:
      - "{{ charon_p2p_tcp_port }}:{{ charon_p2p_tcp_port }}"
      - 127.0.0.1:{{ charon_monitoring_port }}:{{ charon_monitoring_port }}
    restart_policy: always
    state: started
    volumes:
      - "/root/.charon:/opt/charon:rw"
  when: cluster_lock.stat.exists
