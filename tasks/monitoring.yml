---
- name: Ensure home directory for root exists with correct permissions
  file:
    path: /root
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create directory structure for monitoring
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  with_items:
    - "{{ host_config_mount }}/prometheus"
    - "{{ host_config_mount }}/grafana"
    - "{{ host_config_mount }}/grafana/provisioning/dashboards"
    - "{{ host_config_mount }}/grafana/provisioning/datasources"
    - "{{ host_config_mount }}/prometheus/rules"
    - "{{ host_config_mount }}/alertmanager"

- name: Task Copy datasource config
  become_user: root
  become: true
  template:
    src: datasource.yml
    dest: "{{ host_config_mount }}/grafana/provisioning/datasources/datasource.yml"
    force: true
    owner: "root"
    group: "root"
    mode: "0755"
  register: datasource_cfg

- name: Copy dashboard provisioning config
  template:
    src: dashboard.yml
    dest: "{{ host_config_mount }}/grafana/provisioning/dashboards/dashboard.yml"
    owner: root
    group: root
    mode: "0644"
  register: dashboard_cfg

- name: Copy all dashboards
  copy:
    src: "{{ item }}"
    dest: "{{ host_config_mount }}/grafana/provisioning/dashboards/{{ item | basename }}"
    owner: root
    group: root
    mode: "0644"
  with_items:
    - "files/dashboards/system-monitoring-dashboard.json"
    - "files/dashboards/enhanced-validator-dashboard.json"
    - "files/dashboards/node-exporter-dashboard.json"
    - "files/dashboards/enhanced-consensus-client-dashboard.json"
    - "files/dashboards/enhanced-execution-client-dashboard.json"
    - "files/dashboards/obol-dashboard.json"
  register: dashboard_files_cfg

- name: Copy alert rules
  template:
    src: alert_rules.yml
    dest: "{{ host_config_mount }}/prometheus/rules/alert_rules.yml"
    owner: root
    group: root
    mode: "0644"
  register: alertrules_cfg

- name: Copy alertmanager config
  template:
    src: alertmanager.yml
    dest: "{{ host_config_mount }}/alertmanager/alertmanager.yml"
    owner: root
    group: root
    mode: "0644"
  register: alertmanager_cfg

- name: Task copy prometheus.yml
  become_user: root
  become: true
  template:
    src: prometheus.yml
    dest: "{{ host_config_mount }}/prometheus/prometheus.yml"
    force: true
    owner: "root"
    group: "root"
    mode: "0755"
  register: prom_cfg

- name: Monitoring config changed
  ansible.builtin.set_fact:
    cfg_changed: "{{ prom_cfg.changed | bool or datasource_cfg.changed | bool or dashboard_cfg.changed | bool or dashboard_files_cfg.changed | bool or alertrules_cfg.changed | bool or alertmanager_cfg.changed | bool }}"

# Grafana Agent reached end of life in November 2025. It had no remote_write,
# so nothing it scraped ever reached Prometheus or Grafana. Prometheus now
# scrapes the targets only the agent had (validator client, alertmanager),
# so remove the agent from existing hosts.
- name: Remove retired Grafana Agent container
  become_user: root
  become: true
  community.docker.docker_container:
    name: grafana_agent
    state: absent

- name: Remove retired Grafana Agent config
  become_user: root
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "{{ host_config_mount }}/grafana/grafana-agent.yml"
    - "{{ host_config_mount }}/grafana/agent"

- name: Start node exporter
  become_user: root
  become: true
  community.docker.docker_container:
    name: "{{ node_exporter_name }}"
    image: "{{ node_exporter_image }}"
    state: started
    pull: true
    restart_policy: unless-stopped
    restart: "{{ cfg_changed }}"
    networks:
      - name: "eth-staking-network-net"
    networks_cli_compatible: true
    privileged: true
    ports:
      - "127.0.0.1:9100:9100"

- name: Start alertmanager
  become_user: root
  become: true
  community.docker.docker_container:
    name: alertmanager
    image: "{{ alertmanager_image }}"
    state: started
    pull: true
    restart_policy: unless-stopped
    restart: "{{ cfg_changed }}"
    networks:
      - name: "eth-staking-network-net"
    networks_cli_compatible: true
    privileged: true
    ports:
      - "9093:9093"
    volumes:
      - "{{ host_config_mount }}/alertmanager:/etc/alertmanager"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

- name: Start prometheus container
  become_user: root
  become: true
  community.docker.docker_container:
    name: "{{prometheus_name}}"
    image: "{{ prometheus_image }}"
    state: started
    pull: true
    restart_policy: unless-stopped
    restart: "{{ cfg_changed }}"
    networks:
      - name: "eth-staking-network-net"
    networks_cli_compatible: true
    privileged: true
    ports:
      - "9090:9090"
    volumes:
      - "{{ host_config_mount }}/prometheus:/etc/prometheus"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle

- name: Start grafana dashboard container
  become_user: root
  become: true
  community.docker.docker_container:
    name: grafana
    image: "{{ grafana_image }}"
    state: started
    pull: true
    restart_policy: unless-stopped
    restart: "{{ cfg_changed }}"
    networks:
      - name: "eth-staking-network-net"
    networks_cli_compatible: true
    privileged: true
    ports:
      # Grafana listens on 3000 inside the container
      - "{{ grafana_port }}:3000"
    # No plugins are installed: every provisioned dashboard uses built-in panels.
    # To add one, set GF_PLUGINS_PREINSTALL. GF_INSTALL_PLUGINS is deprecated,
    # and a failed install there stops Grafana from starting.
    env:
      GF_SECURITY_ADMIN_PASSWORD: "{{ GRAFANA_ADMIN_PASSWORD }}"
    volumes:
      - "{{ host_config_mount }}/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources"
      - "{{ host_config_mount }}/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards"
