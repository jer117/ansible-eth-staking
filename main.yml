---
# Deploy a full Ethereum home staking node.
# Usage: ansible-playbook -i inventory main.yml
#
# All tasks and variables live in roles/ethereum_home_staking. Override any
# value from roles/ethereum_home_staking/defaults/main.yml in
# host_vars/<inventory_hostname>.yml or group_vars/<group>.yml.
- name: Ethereum home staking node
  hosts: all
  roles:
    - role: ethereum_home_staking
