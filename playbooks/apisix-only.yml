---
# Playbook to deploy only APISIX API Gateway
# Usage: ansible-playbook -i inventory playbooks/apisix-only.yml
#
# Variables come from roles/ethereum_home_staking (imported below through
# playbooks/roles, a symlink to ../roles; importing makes its defaults and vars
# available to every task in this play).
# Override them in host_vars/ or group_vars/ as for main.yml.

- name: Deploy APISIX API Gateway
  hosts: all
  tasks:
    # Supports host_vars files named after the host's IP (older setup.py versions
    # wrote those). Files named after the inventory hostname are loaded by Ansible
    # automatically.
    - name: Load host-specific variables
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/host_vars/{{ ansible_host }}.yml"
      tags: [always]
      when: (inventory_dir ~ '/host_vars/' ~ ansible_host ~ '.yml') is file

    - name: Display APISIX configuration
      ansible.builtin.debug:
        msg:
          - "APISIX Enabled: {{ apisix_enabled }}"
          - "APISIX Image: {{ apisix_image }}"
          - "Gateway Port: {{ apisix_gateway_port }}"
          - "Execution Container: {{ execution_docker_container_name }}"
          - "Consensus Container: {{ consensus_docker_container_name }}"
      tags: [always]

    - name: Ensure pip is installed
      become: true
      ansible.builtin.package:
        name:
          - python3-pip
        state: present
      tags: [always]
      ignore_errors: true

    - name: Install Python dependencies for Docker modules
      become: true
      ansible.builtin.pip:
        name:
          - requests
          - docker
        state: present
      tags: [always]

    - name: Create Docker network
      become: true
      community.docker.docker_network:
        name: eth-staking-network-net
        state: present
      tags: [always]

    - name: Import APISIX tasks
      ansible.builtin.import_role:
        name: ethereum_home_staking
        tasks_from: apisix
      when: apisix_enabled | bool
      tags: [apisix]

    - name: Display post-deployment information
      ansible.builtin.debug:
        msg:
          - "======================================"
          - "  APISIX Deployment Complete"
          - "======================================"
          - ""
          - "Gateway URL: http://{{ ansible_host }}:{{ apisix_gateway_port }}"
          - ""
          - "Client credentials: apisix_api_key / apisix_bearer_token from your vars, or the"
          - "generated ones in credentials/{{ inventory_hostname }}/apisix/ on this machine."
          - ""
          - "Endpoints:"
          - "  • Health: http://{{ ansible_host }}:{{ apisix_gateway_port }}/health"
          - "  • Consensus API: http://{{ ansible_host }}:{{ apisix_gateway_port }}/consensus/*"
          - "  • Execution API: http://{{ ansible_host }}:{{ apisix_gateway_port }}/execution/*"
          - ""
          - "Test with:"
          - "  curl -H 'X-API-Key: YOUR_API_KEY' http://{{ ansible_host }}:{{ apisix_gateway_port }}/consensus/eth/v1/node/version"
          - ""
          - "Verify deployment:"
          - "  ./examples/verify-apisix.sh {{ ansible_host }} YOUR_API_KEY"
          - ""
          - "======================================"
      tags: [always]
# The "Restart APISIX" handler comes from the role.
