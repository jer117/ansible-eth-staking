---
# Deploy only the monitoring stack.
# Usage: ansible-playbook -i inventory playbooks/monitoring.yml
#
# Variables come from roles/ethereum_home_staking. Override them in host_vars/
# or group_vars/ as for main.yml (or pass a file with -e @secrets.yml).
- name: Set up Ethereum monitoring stack
  hosts: ethereum_nodes
  become: true
  tasks:
    - name: Include monitoring tasks
      ansible.builtin.import_role:
        name: ../roles/ethereum_home_staking
        tasks_from: monitoring
