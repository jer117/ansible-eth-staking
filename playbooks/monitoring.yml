---
# Deploy only the monitoring stack.
# Usage: ansible-playbook -i inventory playbooks/monitoring.yml
#
# Variables come from roles/ethereum_home_staking (found through playbooks/roles,
# a symlink to ../roles). Override them in host_vars/ or group_vars/ as for main.yml.
# Targets all hosts like main.yml; use --limit to deploy to some of them.
- name: Set up Ethereum monitoring stack
  hosts: all
  become: true
  tasks:
    - name: Include monitoring tasks
      ansible.builtin.import_role:
        name: ethereum_home_staking
        tasks_from: monitoring
