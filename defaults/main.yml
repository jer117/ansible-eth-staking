---
# Docker Images
# ansible-eth-staking vars
execution_docker_container_name: "eth-ansible-execution-1"
consensus_docker_container_name: "eth-ansible-consensus-1"
validator_docker_container_name: "eth-ansible-validator-1"

# Execution Clients
# Note: nethermind_image is automatically set based on system architecture detection
# Override nethermind_image in host_vars if you need a specific image
nethermind_image: "nethermind/nethermind:2.2.2"  # Fallback/default (will be overridden by architecture detection)
nethermind_image_amd64: "nethermind/nethermind:2.2.2"
nethermind_image_arm64: "jer117/docker-eth-nethermind:2.2.2"

# Consensus Clients
# Note: lighthouse_image is automatically set based on system architecture detection
# Override lighthouse_image in host_vars if you need a specific image
lighthouse_image: "sigp/lighthouse:v8.3.2"  # Fallback/default (will be overridden by architecture detection)
lighthouse_image_amd64: "sigp/lighthouse:v8.3.2"
lighthouse_image_arm64: "sigp/lighthouse:v8.3.2-arm64"

# Teku consensus client
# Note: teku_image is automatically set based on system architecture detection
# Override teku_image in host_vars if you need a specific image
teku_image: "consensys/teku:26.10.3"  # Fallback/default (will be overridden by architecture detection)
teku_image_amd64: "consensys/teku:26.10.3"
teku_image_arm64: "consensys/teku:26.10.3"  # multi-arch; Teku no longer publishes -arm64 tags

prysm_image: "gcr.io/offchainlabs/prysm/beacon-chain:v7.3.1"

lodestar_image: "chainsafe/lodestar:v1.50.1"

charon_docker_image: "obolnetwork/charon:v1.11.2"

# Directories
host_config_mount: ".eth-staking/config"
consensus_data_dir: "/data/consensus"
consensus_config_dir: "{{ host_config_mount }}/config/consensus"
scripts_dir: /usr/local/bin

# Consensus/Execution network
execution:
  networks:
    mainnet: mainnet
    sepolia: sepolia
    hoodi: hoodi

# Monitoring Vars
prometheus_name: "prometheus"

grafana_agent_http_port: 12345
grafana_agent_grpc_port: 9095

node_exporter_name: "node-exporter"

# Cadvisor Vars
cadvisor_enabled: true
# cAdvisor moved its images from gcr.io to ghcr.io after v0.55.
# renovate: datasource=docker depName=ghcr.io/google/cadvisor versioning=docker
cadvisor_image: ghcr.io/google/cadvisor:v0.60.6
# the default CADVISOR_HEALTHCHECK_URL is "http://localhost:8080/healthz"
# so match it
cadvisor_internal_port: 8080
cadvisor_port: 24165

# APISIX API Gateway Vars
apisix_enabled: true
apisix_image: "apache/apisix:3.19.0-debian"
apisix_container_name: "eth-ansible-apisix"
# etcd is no longer used (APISIX runs in standalone mode); the old container is removed on deploy.
apisix_etcd_container_name: "eth-ansible-apisix-etcd"
apisix_config_dir: "/root/.eth-staking/config/apisix"

# APISIX Ports
apisix_gateway_port: 9080
apisix_https_port: 9443
apisix_prometheus_port: 9091

# APISIX client credentials (apisix_api_key, apisix_bearer_token) are deliberately not
# defined here: this file is loaded with include_vars, which would override host_vars.
# Set them in host_vars/secrets, or leave them unset and tasks/apisix.yml generates random
# ones under credentials/<host>/apisix/ on the control machine.
