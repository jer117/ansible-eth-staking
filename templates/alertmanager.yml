{#
  Alertmanager config, rendered by the "Copy alertmanager config" task in tasks/monitoring.yml.

  Where alerts go:
    - telegram_enabled: true  -> Telegram (needs telegram_bot_token and a numeric telegram_chat_id;
                                 tasks/monitoring.yml fails the play if they are missing).
    - otherwise               -> the "null" receiver: nothing is sent anywhere, but firing alerts
                                 are still listed in the Alertmanager UI (port 9093) and on
                                 Prometheus's /alerts page.
  To use another channel (Slack, Discord, email, webhook...), add a receiver below and point
  route.receiver at it: https://prometheus.io/docs/alerting/latest/configuration/#receiver
#}
{% set telegram = telegram_enabled | default(false) | bool %}
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: '{{ "telegram" if telegram else "null" }}'

receivers:
  # Drops notifications. Used when no notification channel is configured.
  - name: 'null'
{% if telegram %}

  - name: 'telegram'
    telegram_configs:
      - bot_token: {{ telegram_bot_token | string | to_json }}
        chat_id: {{ telegram_chat_id | int }}
        parse_mode: 'HTML'
        send_resolved: true
        message: |-
{%- raw %}
          {{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} <b>{{ .Status | toUpper }}</b> {{ .CommonLabels.alertname }}
          {{ range .Alerts }}
          <b>{{ .Annotations.summary }}</b>
          {{ .Annotations.description }}
          <b>Severity:</b> {{ .Labels.severity }} | <b>Job:</b> {{ .Labels.job }} | <b>Instance:</b> {{ .Labels.instance }}
          <b>Since:</b> {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
          {{ end }}
{% endraw %}
{% endif %}
