# testhost has host_vars/testhost.yml; otherhost and armhost only get
# group_vars/all.yml. Facts aren't gathered, so the architecture is set here.
[ethereum_nodes]
testhost ansible_architecture=x86_64
otherhost ansible_architecture=x86_64
armhost ansible_architecture=aarch64

[ethereum_nodes:vars]
ansible_connection=local
ansible_python_interpreter={{ ansible_playbook_python }}
