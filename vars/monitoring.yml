---
# Monitoring Variables

# Container names
prometheus_name: "prometheus"
alertmanager_name: "alertmanager"
loki_name: "loki"
node_exporter_name: "node-exporter"
cadvisor_name: "cadvisor"
grafana_name: "grafana"

# Docker images
prometheus_image: "prom/prometheus:latest"
alertmanager_image: "prom/alertmanager:latest"
loki_image: "grafana/loki:2.9.0"
node_exporter_image: "prom/node-exporter:latest"
cadvisor_image: "gcr.io/cadvisor/cadvisor:v0.47.0"
grafana_image: "grafana/grafana:10.0.0"

# Network ports
prometheus_port: 9090
alertmanager_port: 9093
loki_port: 3100
node_exporter_port: 9100
cadvisor_port: 8080
grafana_port: 3000

# Persistent data, bind-mounted so it survives container recreation
# (image updates, option changes, `docker rm`). Absolute paths on the host.
prometheus_data_dir: "/data/prometheus"
grafana_data_dir: "/data/grafana"

# The upstream images run as these users, so the data dirs must be owned by them.
prometheus_uid: 65534  # "nobody" in prom/prometheus
prometheus_gid: 65534
grafana_uid: 472       # "grafana" in grafana/grafana
grafana_gid: 0         # grafana/grafana runs with the root group

# Prometheus retention: old data is dropped when either limit is reached.
# Size needs a unit (e.g. "10GB"); set it to "0" to only limit by time.
prometheus_retention_time: "30d"
prometheus_retention_size: "10GB"

# Telegram notifications (optional)
telegram_enabled: false
# telegram_bot_token: "YOUR_BOT_TOKEN"
# telegram_chat_id: "YOUR_CHAT_ID"

# Feature flags
# cadvisor_enabled is defined in defaults/main.yml and can be overridden in host_vars

# Security
grafana_admin_password: "{{ GRAFANA_ADMIN_PASSWORD | default('admin') }}" 