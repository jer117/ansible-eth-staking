---
# Monitoring Variables
#
# main.yml loads this file after defaults/main.yml, so anything defined here
# replaces the default. Don't redefine variables from defaults/main.yml here:
# prometheus_name, node_exporter_name and all cadvisor_* settings
# (cadvisor_enabled, cadvisor_image, cadvisor_port, cadvisor_internal_port)
# live only in defaults/main.yml.

# Container names
alertmanager_name: "alertmanager"
loki_name: "loki"
cadvisor_name: "cadvisor"
grafana_name: "grafana"

# Docker images
prometheus_image: "prom/prometheus:latest"
alertmanager_image: "prom/alertmanager:latest"
loki_image: "grafana/loki:2.9.0"
node_exporter_image: "prom/node-exporter:latest"
grafana_image: "grafana/grafana:10.0.0"

# Network ports
prometheus_port: 9090
alertmanager_port: 9093
loki_port: 3100
node_exporter_port: 9100
grafana_port: 3000

# Telegram notifications (optional)
telegram_enabled: false
# telegram_bot_token: "YOUR_BOT_TOKEN"
# telegram_chat_id: "YOUR_CHAT_ID"

# Security
grafana_admin_password: "{{ GRAFANA_ADMIN_PASSWORD | default('admin') }}" 