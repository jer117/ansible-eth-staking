---
role: ethereum-home-staking
config: "{{ role }}.config"

# Set docker container mem limit to 75% of available machine memory
eth_ansible_execution_1_docker_memory: "{{ (ansible_memory_mb.real.total * 0.45) | round | int }}M"

# Validator Client Configuration
validator_container_name: "{{ validator_docker_container_name }}"
validator_keys_mount: "/root/.lighthouse/validators"
validator_data_mount: "/root/.lighthouse/validator-data"
validator_graffiti: "JerCoffeegang Staking"
validator_client_http_api_port: 5064
validator_monitoring_port: 8009

# execution ports
# Nethermind uses this port for P2P over TCP and for discovery over UDP
# (--Network.P2PPort and --Network.DiscoveryPort in tasks/nethermind.yml).
eth_ansible_execution_1_p2p_port: 30304
eth_ansible_execution_1_engine_port: 8552
eth_ansible_execution_1_rpc_port: 8544
eth_ansible_execution_1_websocket_port: 8548

# Execution / docker mounts (override if neccessary)
execution_config_mount: /root/.nethermind/exec_token
execution_data_mount: /data/execution

# Consensus / docker mounts (override if neccessary)
consensus_config_mount: /root/.lighthouse/config
consensus_data_mount: /data/consensus
consensus_jwt_secret_mount: /root/.lighthouse/config/exec_token

docker_config_mount: /root/.nethermind
docker_data_mount: /data

# Geth Execution Layer Client
execution_data_dir: "/data/execution"
execution_container_name: execution
letsencrypt_port: 80
execution_monitoring_port: 6060
execution_auth_port: 8552

# Charon variables
# Charon's libp2p listens on TCP only. Its QUIC transport is an alpha feature
# (off by default up to at least v1.11) and only binds UDP when
# --p2p-udp-address is set, so no UDP port is published for Charon.
charon_p2p_tcp_port: 3610
charon_validator_api_port: 3600
charon_monitoring_port: 3620
charon_container_name: charon
charon_relay_address: https://0.relay.obol.tech
charon_enabled: "true"

# Validator client selection (lighthouse or lodestar)
# This should be set in your secrets file to override the default
# validator_client: "lighthouse"

# mev
mev_boost_docker_image: "flashbots/mev-boost:1.9"
mev_boost_enabled: "true"
mev_enabled: "{{ mev_boost_enabled }}"
mev_boost_container_name: mev-boost
mev_nework_name: "{{ network }}"
mev_boost_api_port: 18550


host_config_files:
  - config.toml

# Execution Layer docker ports
# Docker publishes TCP only unless a mapping ends in /udp, so the P2P port is
# listed twice: TCP for devp2p connections and UDP for peer discovery.
# JSON-RPC and the Engine API are bound to localhost: Docker publishes ports
# past ufw, and the beacon node, APISIX and Prometheus reach Nethermind by
# container name over the Docker network. Use APISIX for remote RPC access.
eth_ansible_execution_1_docker_ports:
  - "{{ eth_ansible_execution_1_p2p_port }}:{{ eth_ansible_execution_1_p2p_port }}/tcp"
  - "{{ eth_ansible_execution_1_p2p_port }}:{{ eth_ansible_execution_1_p2p_port }}/udp"
  - "127.0.0.1:{{ eth_ansible_execution_1_rpc_port }}:{{ eth_ansible_execution_1_rpc_port }}"
  - "127.0.0.1:{{ eth_ansible_execution_1_engine_port }}:{{ eth_ansible_execution_1_engine_port }}"

consensus_monitoring_port: 8081
consensus_client_http_api_port: 5062
consensus_client_p2p_port: 9000   # libp2p over TCP + discv5 discovery over UDP
consensus_client_quic_port: 9001  # libp2p QUIC over UDP (Lighthouse)

# Lighthouse cache configuration for rewards API and state queries
# Increasing these can help with rewards/attestations endpoint performance
consensus_shuffling_cache_size: 64  # Cache size in epochs for shuffling data (helps with rewards API)
consensus_state_cache_size: 256     # Number of states to cache in memory (default: 128)

# Teku-specific configuration
# Teku JVM heap size - adjust based on your server's memory
teku_heap_size: "8g"               # Default: 4GB, recommended: 8GB+ for archive nodes
teku_log_level: "INFO"             # Options: TRACE, DEBUG, INFO, WARN, ERROR

# Beacon Node published ports
# Lighthouse listens on P2P TCP, discovery UDP (same port) and QUIC UDP.
# Teku 25.x listens on P2P TCP and discovery UDP only; Teku 26.7+ also enables
# QUIC on UDP 9001 by default. consensus_client_quic_port is not passed to
# Teku, because 25.x rejects the --p2p-quic-port flag.
beacon_published_ports:
  - "127.0.0.1:{{ consensus_client_http_api_port }}:{{ consensus_client_http_api_port }}"
  - "{{ consensus_client_p2p_port }}:{{ consensus_client_p2p_port }}/tcp"
  - "{{ consensus_client_p2p_port }}:{{ consensus_client_p2p_port }}/udp"
  - "{{ consensus_client_quic_port }}:{{ consensus_client_quic_port }}/udp"

validator_published_ports:
  - 127.0.0.1:{{ validator_client_http_api_port }}:{{ validator_client_http_api_port }}
  - 127.0.0.1:{{ validator_monitoring_port }}:{{ validator_monitoring_port }}
