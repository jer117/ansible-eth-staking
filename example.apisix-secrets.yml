---
# APISIX Security Configuration
# Copy the entries you need to your secrets.yml or host_vars and set secure values.
#
# Both credentials are optional. If you leave them unset, Ansible generates random
# 48-character values on the first run and stores them on the control machine in
# credentials/<inventory_hostname>/apisix/api_key and .../bearer_token (next to your
# inventory file, gitignored), reusing them on later runs. Read them with:
#   cat credentials/<inventory_hostname>/apisix/api_key
#
# If you set them yourself, use random values of at least 16 characters. The playbook
# refuses shorter values and the placeholders below.

# APISIX API Key for client authentication
# Used in X-API-Key header by clients
# Generate with: openssl rand -hex 32
# apisix_api_key: "change-this-to-a-random-value"

# APISIX Bearer Token for client authentication
# Used in Authorization: Bearer <token> header by clients
# Generate with: openssl rand -hex 32 (openssl rand -base64 32 also works)
# apisix_bearer_token: "change-this-to-a-random-value"
